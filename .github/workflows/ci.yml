name: DevOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t hello-devops-web .

      - name: Build backend image
        run: docker build -t hello-devops-backend ./backend

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push frontend image
        if: github.event_name == 'push'
        run: |
          docker tag hello-devops-web ${{ secrets.DOCKERHUB_USERNAME }}/hello-devops-web:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hello-devops-web:latest

      - name: Push backend image
        if: github.event_name == 'push'
        run: |
          docker tag hello-devops-backend ${{ secrets.DOCKERHUB_USERNAME }}/hello-devops-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hello-devops-backend:latest