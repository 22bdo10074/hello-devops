<body>

    <div class="container">

        <h1>Hello DevOps</h1>

        <h2>My First Docker Project</h2>

        <p>Created by Sandhya</p>

        <p>
            Backend Status:
            <strong id="backend-response">Checking...</strong>
        </p>

    </div>

    <script>
        async function checkBackend() {
            try {
                const response = await fetch("http://localhost:3000");
                const data = await response.json();

                document.getElementById("backend-response").textContent =
                    data.message;
            } catch (error) {
                document.getElementById("backend-response").textContent =
                    "Backend is not reachable";
            }
        }

        checkBackend();
    </script>

</body>
